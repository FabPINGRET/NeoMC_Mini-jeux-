name: CI

on:
  push:
    branches: [main, Fab]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    name: Validation JSON et mcfunction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON valides (dialogs, tags, pack.mcmeta)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob('data/**/*.json', recursive=True) + ['pack.mcmeta']:
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('JSON OK')
          PY
      - name: Vérifications mcfunction basiques
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          fns = {f[len('data/mg/function/'):-len('.mcfunction')]
                 for f in glob.glob('data/mg/function/**/*.mcfunction', recursive=True)}
          for f in glob.glob('data/mg/function/**/*.mcfunction', recursive=True):
              for i, line in enumerate(open(f, encoding='utf-8'), 1):
                  s = line.strip()
                  if not s or s.startswith('#'):
                      continue
                  if '$(' in s:
                      continue  # appels macro, résolus à l'exécution
                  if '<<<<<<<' in s or '>>>>>>>' in s:
                      bad.append(f'{f}:{i}: marqueur de conflit')
                  for m in re.finditer(r'\bfunction mg:([a-z_0-9/]+)', s):
                      if m.group(1) not in fns:
                          bad.append(f'{f}:{i}: fonction inconnue mg:{m.group(1)}')
          if bad:
              print('\n'.join(bad[:50])); sys.exit(1)
          print('mcfunction OK')
          PY
      - name: Désinstallation complète (objectifs, schedule, bossbars, équipes)
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          # Tout ce que le pack crée doit être retiré par mg:desinstaller (ou une fonction qu'il appelle)
          rules = [  # (genre, création, suppression)
              ('objectif', r'scoreboard objectives add ([^ ]+)', r'scoreboard objectives remove ([^ ]+)'),
              ('schedule', r'schedule function (mg:[a-z_0-9/]+)', r'schedule clear (mg:[a-z_0-9/]+)'),
              ('bossbar', r'bossbar add ([^ ]+)', r'bossbar remove ([^ ]+)'),
              ('équipe', r'team add ([^ ]+)', r'team remove ([^ ]+)'),
          ]
          code = {}
          for f in glob.glob('data/mg/function/**/*.mcfunction', recursive=True):
              name = 'mg:' + f.replace(os.sep, '/')[len('data/mg/function/'):-len('.mcfunction')]
              code[name] = [(i, l.strip()) for i, l in enumerate(open(f, encoding='utf-8'), 1)
                            if l.strip() and not l.strip().startswith('#') and '$(' not in l]
          # Fonctions atteintes depuis mg:desinstaller
          todo, seen = ['mg:desinstaller'], set()
          while todo:
              fn = todo.pop()
              if fn in seen or fn not in code:
                  continue
              seen.add(fn)
              for _, s in code[fn]:
                  todo += re.findall(r'\bfunction (mg:[a-z_0-9/]+)', s)
          made = {r[0]: {} for r in rules}
          gone = {r[0]: set() for r in rules}
          for fn in sorted(code):
              for i, s in code[fn]:
                  for kind, add, rm in rules:
                      for m in re.finditer(add, s):
                          made[kind].setdefault(m.group(1), f'{fn}:{i}')
                      if fn in seen:
                          gone[kind].update(re.findall(rm, s))
          bad = [f'{made[k][x]}: {k} {x} jamais retiré par mg:desinstaller'
                 for k in made for x in sorted(made[k]) if x not in gone[k]]
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('desinstaller OK')
          PY
      - name: Lint Spyglass (indicatif)
        continue-on-error: true
        run: |
          npx --yes @spyglassmc/cli@latest lint . || echo "Spyglass a signalé des problèmes (non bloquant)"

  build:
    name: Zip du datapack
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Construit le zip
        run: zip -qr minijeux_void.zip README.md pack.mcmeta data
      - uses: actions/upload-artifact@v4
        with:
          name: minijeux_void
          path: minijeux_void.zip
      - name: Release GitHub (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: minijeux_void.zip
