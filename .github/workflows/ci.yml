name: CI

on:
  push:
    branches: [main, Fab]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    name: Validation JSON et mcfunction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON valides (dialogs, tags, pack.mcmeta)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob('data/**/*.json', recursive=True) + ['pack.mcmeta']:
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('JSON OK')
          PY
      - name: Vérifications mcfunction basiques
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          fns = {f[len('data/mg/function/'):-len('.mcfunction')]
                 for f in glob.glob('data/mg/function/**/*.mcfunction', recursive=True)}
          for f in glob.glob('data/mg/function/**/*.mcfunction', recursive=True):
              for i, line in enumerate(open(f, encoding='utf-8'), 1):
                  s = line.strip()
                  if not s or s.startswith('#'):
                      continue
                  if '$(' in s:
                      continue  # appels macro, résolus à l'exécution
                  if '<<<<<<<' in s or '>>>>>>>' in s:
                      bad.append(f'{f}:{i}: marqueur de conflit')
                  for m in re.finditer(r'\bfunction mg:([a-z_0-9/]+)', s):
                      if m.group(1) not in fns:
                          bad.append(f'{f}:{i}: fonction inconnue mg:{m.group(1)}')
          if bad:
              print('\n'.join(bad[:50])); sys.exit(1)
          print('mcfunction OK')
          PY
      - name: Lint Spyglass (indicatif)
        continue-on-error: true
        run: |
          npx --yes @spyglassmc/cli@latest lint . || echo "Spyglass a signalé des problèmes (non bloquant)"

  build:
    name: Zip du datapack
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Construit le zip
        run: zip -qr minijeux_void.zip README.md pack.mcmeta data
      - uses: actions/upload-artifact@v4
        with:
          name: minijeux_void
          path: minijeux_void.zip
      - name: Release GitHub (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: minijeux_void.zip
